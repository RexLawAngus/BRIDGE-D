id = "hamd17"
name = "Hamilton Depression Rating Scale (17 items)"
version = "1.0.0"
language = "en"
rater = "clinician"
recall = "past week"
license = "public-domain"
citation = "Hamilton M. J Neurol Neurosurg Psychiatry. 1960;23:56-62."
