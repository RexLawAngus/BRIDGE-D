[project]
name = "bridge-d"
version = "0.1.2"
description = "BRIDGE-D: instrument-as-data scoring and comparison for depression scales"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xiaoyu She" }]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[project.urls]
Homepage = "https://github.com/RexLawAngus/BRIDGE-D"
Repository = "https://github.com/RexLawAngus/BRIDGE-D"
Issues = "https://github.com/RexLawAngus/BRIDGE-D/issues"

[project.scripts]
bridged = "bridged.cli:main"

[tool.setuptools]
packages = ["bridged"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
