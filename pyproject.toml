[project]
name = "bridge-d"
version = "0.5.0"
description = "BRIDGE-D: instrument-as-data scoring, comparison, and empirical item mapping"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Xiaoyu She" }]
requires-python = ">=3.11"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
docx = ["python-docx"]
map = ["scipy>=1.10", "scikit-learn>=1.2", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/RexLawAngus/BRIDGE-D"
Repository = "https://github.com/RexLawAngus/BRIDGE-D"
Issues = "https://github.com/RexLawAngus/BRIDGE-D/issues"

[project.scripts]
bridged = "bridged.cli:main"

[tool.setuptools]
packages = ["bridged"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
